:root[data-pal="sepia"]{--void:#211915;--ink:#2A201B;--deep:#281E19;--line:#43352D;--line-hi:#5E4B40;--bone:#EADCC6;--bone-lo:#C2B39C;--mute:#B0A08E;--cyan:#E2A85E;--cyan-lo:#5E4321;--blood:#D46A5A;--blood-lo:#5A2A22;--shade:#15100D;--dim:#33281F;--btn-sh:#8F7D6C;--card-red:#B8473A;--on-acc:#211915;--gild:#DCC9A6}
:root[data-pal="moss"]{--void:#1A1E1B;--ink:#222823;--deep:#202621;--line:#343D36;--line-hi:#4B574E;--bone:#E1DDCB;--bone-lo:#B8B39F;--mute:#A0A899;--cyan:#9CC48A;--cyan-lo:#3A4D33;--blood:#D98473;--blood-lo:#593029;--shade:#111412;--dim:#2A312C;--btn-sh:#848A7E;--card-red:#B9503F;--on-acc:#1A1E1B;--gild:#D3CDB4}
*{box-sizing:border-box}
html{height:100%;background:var(--void);overscroll-behavior:none}
body{height:100%;margin:0;background:var(--void);color:var(--bone);font-family:var(--f-ui);font-size:14px;line-height:1.3;overflow:hidden;
  -webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
[hidden]{display:none!important}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;image-rendering:pixelated;image-rendering:crisp-edges}
#bg{z-index:0}#fx{z-index:60}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background-image:conic-gradient(var(--deep) 25%,transparent 0 50%,var(--deep) 0 75%,transparent 0);background-size:4px 4px;
  -webkit-mask:radial-gradient(closest-side,transparent 72%,var(--void) 100%);mask:radial-gradient(closest-side,transparent 72%,var(--void) 100%)}
#app{height:100%;max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 12px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;border-radius:0}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
svg.px{shape-rendering:crispEdges;display:block;fill:currentColor}
.lbl{font-size:12px;letter-spacing:.04em;color:var(--mute);line-height:1}
.num{font-variant-numeric:tabular-nums}
#app.shake{animation:shake 240ms steps(1) 2}
@keyframes shake{0%{transform:translate(3px,0)}25%{transform:translate(-3px,3px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-3px,0)}100%{transform:none}}
#app.enter > *{animation:rise 260ms steps(3) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* top bar */
.top{display:flex;align-items:center;gap:10px;min-height:44px;flex:none}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;background:var(--void);box-shadow:inset 0 0 0 2px var(--line-hi)}
.iconbtn svg{width:18px;height:18px}
.ante{display:flex;align-items:baseline;gap:6px;margin-right:auto;white-space:nowrap;min-width:0;overflow:hidden}
.ante b{font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.8;color:var(--bone)}
.ante .of{font-size:14px;color:var(--mute)}
.cons{display:flex;gap:8px}
.cslot{width:32px;height:42px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.cslot.full{background:var(--ink);box-shadow:inset 0 0 0 2px var(--cyan),3px 3px 0 0 var(--cyan-lo)}
.cslot.k-charm{box-shadow:inset 0 0 0 2px var(--blood),3px 3px 0 0 var(--blood-lo)}
.cslot svg{width:18px;height:18px}
.cslot.k-star svg{color:var(--cyan)}.cslot.k-charm svg{color:var(--blood)}
.money{flex:none;font-weight:700;font-size:24px;line-height:1;text-align:right;white-space:nowrap}
.money i{font-style:normal;color:var(--cyan)}
.money.flash{animation:mflash 360ms steps(1)}
@keyframes mflash{0%{color:var(--cyan)}50%{color:var(--bone)}75%{color:var(--cyan)}}

/* plaque */
.plaque{flex:none;margin:4px;padding:10px 14px 12px;background:var(--void);display:grid;gap:8px;position:relative;
  box-shadow:0 0 0 2px var(--bone),0 0 0 4px var(--void),0 0 0 6px var(--bone)}
.plaque::before,.plaque::after{content:"";position:absolute;width:8px;height:8px;background:var(--cyan)}
.plaque::before{left:-6px;top:-6px}.plaque::after{right:-6px;bottom:-6px}
.plaque.isboss{box-shadow:0 0 0 2px var(--blood),0 0 0 4px var(--void),0 0 0 6px var(--blood)}
.plaque.isboss::before,.plaque.isboss::after{background:var(--bone)}
.pl-top{display:flex;align-items:center;gap:10px;min-width:0}
.bname{margin:0;font-family:var(--f-title);font-weight:400;font-size:38px;line-height:.8;color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
.isboss .bname{color:var(--blood)}
.bicon{width:27px;height:27px;color:var(--blood);flex:none}
.pills{display:flex;gap:6px;flex:none}
.pill{font-size:12px;line-height:1;color:var(--mute);box-shadow:inset 0 0 0 2px var(--line);padding:6px 7px;white-space:nowrap}
.pill b{color:var(--bone);font-weight:700;font-size:14px}
.twist{font-size:13px;line-height:1.35;color:var(--bone);background:var(--blood-lo);padding:6px 8px}
.pl-mid{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;min-width:0}
.pl-mid > div{min-width:0}
.pl-mid > div{display:grid;gap:4px}
.score-n{font-weight:700;font-size:30px;line-height:1;color:var(--bone)}
.score-n.bump{animation:bump 480ms steps(1)}
@keyframes bump{0%{color:var(--cyan);transform:translateY(-3px)}33%{color:var(--bone);transform:none}66%{color:var(--cyan)}100%{color:var(--bone)}}
.tgt{text-align:right}.tgt b{font-weight:700;font-size:20px;line-height:1;color:var(--blood)}
.segs{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;height:8px}
.segs i{background:var(--dim)}.segs i.on{background:var(--cyan)}

/* trick rail */
.rail{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;touch-action:pan-y}
.trick{position:relative;height:var(--th,82px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 3px;min-width:0;
  background:var(--ink);box-shadow:inset 0 0 0 2px var(--rc,var(--bone)),3px 3px 0 0 var(--rs,var(--shade));color:var(--bone);transition:transform 90ms steps(3)}
.trick svg{width:36px;height:36px;color:var(--rc,var(--bone))}
.trick .tn{font-size:11px;line-height:1.15;text-align:center;width:100%;overflow:hidden;white-space:normal;overflow-wrap:normal;word-break:keep-all}
.r-Common{--rc:var(--bone);--rs:var(--shade)}
.r-Uncommon{--rc:var(--cyan);--rs:var(--cyan-lo)}
.r-Rare{--rc:var(--blood);--rs:var(--blood-lo)}
.r-Rare svg{animation:glint 2.6s steps(1) infinite}
@keyframes glint{0%,86%{color:var(--blood)}88%{color:var(--bone)}91%{color:var(--blood)}94%{color:var(--bone)}}
.trick.empty{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.trick.empty::before{content:"";width:6px;height:6px;background:var(--line-hi)}
.trick.drag{z-index:5;transform:translateY(-8px);box-shadow:inset 0 0 0 2px var(--cyan),5px 5px 0 0 var(--cyan);transition:none}
.trick.hit{animation:hitT 300ms steps(1)}
@keyframes hitT{0%{background:var(--bone);color:var(--ink);transform:translateY(-8px)}50%{background:var(--ink);transform:translateY(-4px)}100%{transform:none}}
.trick.hit svg{animation:none}

/* readout */
.readout{flex:none;display:grid;gap:8px;justify-items:center}
.hname{min-height:26px;line-height:26px;font-weight:700;font-size:18px;text-align:center;white-space:nowrap}
.hname .lv{font-weight:400;font-size:12px;color:var(--cyan);margin-left:8px}
.hname.hint{font-weight:400;font-size:14px;color:var(--mute)}
.hname.total{font-family:var(--f-title);font-weight:400;font-size:46px;line-height:26px;animation:totG 520ms steps(1) infinite}
@keyframes totG{0%{text-shadow:3px 0 var(--cyan),-3px 0 var(--blood)}50%{text-shadow:-3px 0 var(--cyan),3px 0 var(--blood)}}
.cm{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;width:100%;align-items:center}
.plate{display:grid;gap:3px;padding:6px 10px 7px;color:var(--on-acc);min-width:0}
.plate.chips{background:var(--cyan)}.plate.mult{background:var(--blood)}
.plate span{font-size:11px;font-weight:700;line-height:1}
.plate b{font-weight:700;font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-align:right}
.plate.flare{animation:flare 200ms steps(1)}
@keyframes flare{0%{background:var(--bone)}100%{}}
.times{font-size:20px;color:var(--bone)}

/* table */
.table{flex:1 1 auto;min-height:72px;position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.ring{position:absolute;left:50%;top:50%;width:var(--rs2,220px);height:var(--rs2,220px);transform:translate(-50%,-50%);color:var(--shade);pointer-events:none}
.ring .d{fill:var(--cyan);opacity:.15;animation:rune 2.4s steps(1) infinite}
@keyframes rune{0%{opacity:1}12%{opacity:.45}24%,100%{opacity:.15}}
.bigeye{position:absolute;left:50%;top:50%;width:72px;height:72px;margin:-36px 0 0 -36px;color:var(--shade);animation:blink 5s steps(1) infinite;pointer-events:none}
@keyframes blink{0%,90%{transform:none}92%{transform:scaleY(.34)}95%{transform:scaleY(.12)}97%{transform:scaleY(.34)}}
.table .hint{position:absolute;bottom:4px;left:48px;right:48px;margin:0;text-align:center;font-size:12px;line-height:16px;color:var(--mute)}
.caret{display:inline-block;width:7px;height:12px;background:var(--cyan);vertical-align:-1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.deckpile{position:absolute;right:2px;bottom:4px;width:38px;height:54px}
.deckpile i{position:absolute;inset:0;background:var(--void);box-shadow:inset 0 0 0 2px var(--bone);background-image:conic-gradient(var(--shade) 25%,var(--void) 0 50%,var(--shade) 0 75%,var(--void) 0);background-size:4px 4px}
.deckpile i:nth-child(1){transform:translate(-4px,4px)}.deckpile i:nth-child(2){transform:translate(-2px,2px)}
.deckpile span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--bone);text-shadow:2px 2px 0 var(--void),-2px -2px 0 var(--void)}

/* cards */
.handzone{position:relative;flex:none;width:100%;touch-action:none}
.card{position:absolute;top:26px;width:var(--cw,56px);height:calc(var(--cw,56px)*1.42);padding:0;display:block;text-align:left;
  transition:left 90ms steps(3),transform 80ms steps(2)}
.card::before{content:"";position:absolute;inset:0;transform:translate(3px,3px);background:var(--shade);clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px)}
.card .fr{display:block;position:absolute;inset:0;background:var(--bone);padding:2px;clip-path:polygon(4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px),0 4px,2px 4px,2px 2px,4px 2px)}
.card .fc{display:block;position:relative;width:100%;height:100%;background:var(--bone);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);clip-path:polygon(2px 0,calc(100% - 2px) 0,100% 2px,100% calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,0 calc(100% - 2px),0 2px);overflow:hidden}
.card .rk{position:absolute;left:calc(var(--cw,56px)*.1);top:calc(var(--cw,56px)*.09);height:calc(var(--ru,2px)*9)}
.card .su{position:absolute;left:calc(var(--cw,56px)*.1);top:calc(var(--cw,56px)*.09 + var(--ru,2px)*9 + 4px);width:var(--ss,22px);height:var(--ss,22px)}
.card .bg{position:absolute;right:calc(var(--cw,56px)*.1);bottom:calc(var(--cw,56px)*.1);width:var(--sb,30px);height:var(--sb,30px)}
body.four .card.s-D .fc{color:#1D5BD8}
body.four .card.s-C .fc{color:#1E7B34}
body.four .card.drag.s-D .fc{color:#7FA8FF}
body.four .card.drag.s-C .fc{color:#6CD38A}
.card.red .fc{color:var(--card-red)}
.card .st{position:absolute;left:3px;bottom:3px;font-weight:700;font-size:max(9px,calc(var(--cw,56px)*.15));line-height:1;padding:2px 3px;color:var(--on-acc)}
.e-etched .st{background:var(--cyan)}
.e-inked .st{background:var(--blood)}
.e-gilded .st{background:var(--bone);color:var(--on-acc);box-shadow:inset 0 0 0 1px var(--void)}
.e-gilded .fc{background-color:var(--bone);background-image:conic-gradient(var(--gild) 25%,transparent 0 50%,var(--gild) 0 75%,transparent 0);background-size:4px 4px;animation:gild 1.2s steps(2) infinite}
@keyframes gild{to{background-position:2px 0}}
.e-prism .fr{animation:prism 900ms steps(1) infinite}
@keyframes prism{0%{background:var(--cyan)}33%{background:var(--blood)}66%{background:var(--bone)}}
.e-prism .st{background:var(--void);color:var(--cyan)}
.e-brittle .st{background:var(--void);color:var(--bone)}
.card .crack{position:absolute;inset:0;width:100%;height:100%;color:var(--ink);opacity:.6;pointer-events:none}
.card.sel{transform:translateY(-18px)}
.card.sel::before{background:var(--cyan-lo)}
.card.sel .fr{background:var(--cyan)}
.card.drag{transition:none;z-index:80!important}
.card.drag::before{transform:translate(6px,6px);background:var(--cyan)}
.card.drag .fc{background:var(--ink);color:var(--bone);box-shadow:inset 0 0 0 2px var(--bone)}
.card.drag.red .fc{color:var(--blood)}
.card.down .fc{background:var(--void);box-shadow:inset 0 0 0 2px var(--bone);background-image:conic-gradient(var(--shade) 25%,var(--void) 0 50%,var(--shade) 0 75%,var(--void) 0);background-size:4px 4px}
.card.down .fc > *{display:none}
.card.down .fc::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;background:var(--cyan);
  clip-path:polygon(0 50%,25% 25%,75% 25%,100% 50%,75% 75%,25% 75%)}
.card.deal{animation:deal 260ms steps(4) backwards;animation-delay:calc(var(--d,0)*55ms)}
@keyframes deal{from{transform:translate(var(--dx,120px),var(--dy,-60px))}to{transform:none}}
.card.reveal .fc{animation:reveal 300ms steps(1) backwards;animation-delay:calc(var(--d,0)*45ms)}
@keyframes reveal{0%{background:var(--void)}50%{background:var(--cyan)}100%{}}
.card.toss{animation:toss 260ms steps(4) forwards}
@keyframes toss{0%{transform:translate(0,-18px)}100%{transform:translate(80px,-150px);opacity:0}}
.table .card{position:relative;top:auto;left:auto;flex:none}
.table .card.kicker .fc::after{content:"";position:absolute;inset:0;background-image:conic-gradient(var(--void) 25%,transparent 0 50%,var(--void) 0 75%,transparent 0);background-size:4px 4px}
.table .card.hit{animation:hitC 300ms steps(1) forwards}
@keyframes hitC{0%{transform:translateY(-12px)}25%{transform:translateY(-16px)}50%{transform:translateY(-9px)}100%{transform:translateY(-6px)}}
.table .card.hit .fc{background:var(--ink);color:var(--bone);box-shadow:inset 0 0 0 2px var(--cyan)}
.table .card.hit.red .fc{color:var(--blood)}
body.four .table .card.hit.s-D .fc{color:#7FA8FF}
body.four .table .card.hit.s-C .fc{color:#6CD38A}

/* actions */
.actions{flex:none;display:grid;grid-template-columns:1fr 70px 1fr;gap:10px}
.actions.two{grid-template-columns:1fr 1fr}
.btn{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 10px;font-weight:700;font-size:20px;letter-spacing:.04em;line-height:1;
  transition:transform 60ms steps(1)}
.btn small{font-weight:400;font-size:12px;letter-spacing:0}
.btn.main{background:var(--bone);color:var(--on-acc);box-shadow:0 5px 0 0 var(--btn-sh)}
.btn.ghost{background:var(--void);color:var(--bone);box-shadow:inset 0 0 0 2px var(--bone),0 5px 0 0 var(--shade)}
.btn.alt{background:var(--void);color:var(--cyan);box-shadow:inset 0 0 0 2px var(--cyan),0 5px 0 0 var(--cyan-lo);font-size:14px}
.actions .btn.alt{padding:0 4px}
.btn.danger{color:var(--blood);box-shadow:inset 0 0 0 2px var(--blood),0 5px 0 0 var(--blood-lo)}
.btn:active:not(:disabled){transform:translateY(5px)}
.btn.main:active:not(:disabled){box-shadow:none}
.btn.ghost:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--bone)}
.btn.alt:active:not(:disabled){box-shadow:inset 0 0 0 2px var(--cyan)}
.btn:disabled{opacity:.35}
.btn.sm{min-height:46px;font-size:16px}
.btn.wide{width:100%}

/* screens */
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 6px 8px;margin-inline:-6px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.screen-h{margin:2px 0 0;font-family:var(--f-title);font-weight:400;font-size:44px;line-height:.9;color:var(--bone)}
.screen-h em{font-style:normal;color:var(--cyan)}
.sub{margin:0;font-size:13px;line-height:1.45;color:var(--mute);max-width:46ch}
.blinds{display:grid;gap:12px}
.brw{display:flex;align-items:center;gap:12px;padding:12px;background:var(--void);box-shadow:inset 0 0 0 2px var(--line)}
.brw.now{box-shadow:inset 0 0 0 2px var(--bone),4px 4px 0 0 var(--cyan)}
.brw.now.isboss{box-shadow:inset 0 0 0 2px var(--blood),4px 4px 0 0 var(--blood-lo)}
.brw.done{opacity:.45}
.bsig{width:48px;height:48px;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line-hi);font-family:var(--f-title);font-size:34px;line-height:1;color:var(--bone)}
.bsig svg{width:27px;height:27px;color:var(--blood)}
.brw .bl{flex:1;min-width:0;display:grid;gap:5px}
.brw .bt{font-family:var(--f-title);font-size:30px;line-height:.85;color:var(--bone)}
.brw.isboss .bt{color:var(--blood)}
.brw .tw{font-size:12px;line-height:1.4;color:var(--bone)}
.brw .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.brw .meta b{font-weight:700;font-size:16px}
.brw .rew{font-weight:700;color:var(--cyan);font-size:14px}
.bact{display:grid;gap:8px;width:92px;flex:none}
.bstate{font-size:12px;color:var(--mute);width:72px;text-align:right;flex:none}

.offers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.offer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;text-align:center;min-width:0;background:var(--ink);
  box-shadow:inset 0 0 0 2px var(--rc,var(--bone)),4px 4px 0 0 var(--rs,var(--shade))}
.offer.k-charm{--rc:var(--blood);--rs:var(--blood-lo)}
.offer.k-star{--rc:var(--cyan);--rs:var(--cyan-lo)}
.offer.k-pack{--rc:var(--bone);--rs:var(--shade);background-image:conic-gradient(var(--deep) 25%,transparent 0 50%,var(--deep) 0 75%,transparent 0);background-size:4px 4px}

let CY = '#3BF4FF', BL = '#FF2D55', BO = '#F3ECDB';
const PAL = {lineHi:'#4A4560'};
function readPal(){ const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim(); CY = g('--cyan') || CY; BL = g('--blood') || BL; BO = g('--bone') || BO; PAL.lineHi = g('--line-hi') || PAL.lineHi; }

const PX = 3;
const Amb = (() => {
  const cv = $('#bg'), ctx = cv.getContext('2d');
  let W = 0, H = 0, motes = [], raf = 0, last = 0;
  const mote = any => ({x:Math.random()*W|0, y:any ? Math.random()*H : H + 2, v:2 + Math.random()*5, c:Math.random() < .3 ? 'cy' : 'lo', ph:Math.random()*6});
  function size(){ W = Math.ceil(innerWidth/PX); H = Math.ceil(innerHeight/PX); cv.width = W; cv.height = H; motes = Array.from({length: Math.round(W*H/900)}, () => mote(true)); }
  function draw(t, dt){
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.y -= m.v*dt; if (m.y < -2) Object.assign(m, mote(false));
      const on = Math.sin(t*1.3 + m.ph) > -0.3;
      if (!on) continue;
      ctx.fillStyle = m.c === 'cy' ? CY : PAL.lineHi; ctx.fillRect(Math.round(m.x + Math.sin(t*.4 + m.ph)*2), Math.round(m.y), 1, 1);
    }
  }
  function frame(t){ raf = requestAnimationFrame(frame); if (t - last < 100) return; const dt = last ? Math.min(.3, (t - last)/1000) : .1; last = t; draw(t/1000, dt); }
  function start(){ cancelAnimationFrame(raf); last = 0; if (reduced) draw(5, 0); else raf = requestAnimationFrame(frame); }
  size(); start();
  addEventListener('resize', () => { size(); if (reduced) draw(5, 0); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
})();
const FX = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, ps = [], running = false, last = 0;
  function size(){ W = Math.ceil(innerWidth/PX); H = Math.ceil(innerHeight/PX); cv.width = W; cv.height = H; }
  size(); addEventListener('resize', size);
  function kick(){ if (!running) { running = true; last = performance.now(); requestAnimationFrame(step); } }
  function step(t){
    if (t - last < 33) { requestAnimationFrame(step); return; }
    const dt = Math.min(.08, (t - last)/1000); last = t;
    ctx.clearRect(0, 0, W, H);
    ps = ps.filter(p => (p.life -= dt) > 0);
    for (const p of ps) {
      if (p.ring) {
        const r = p.r0 + (1 - p.life/p.max)*p.grow, n = Math.max(12, Math.round(r*5));
        ctx.fillStyle = p.c;
        for (let i = 0; i < n; i++) { const a = i/n*6.2832; ctx.fillRect(Math.round(p.x + Math.cos(a)*r), Math.round(p.y + Math.sin(a)*r), 1, 1); }

      }
    }
    if (ps.length) requestAnimationFrame(step); else { running = false; ctx.clearRect(0, 0, W, H); }
  }
  return {
    burst(xc, yc, cols, n, spd, life, g){
      if (reduced) return;
      const x = xc/PX, y = yc/PX;
      for (let i = 0; i < (n || 12); i++) {
        const a = Math.random()*6.2832, v = (spd || 45)*(.4 + Math.random()*.8);
        ps.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 10, life:(life || .55)*(.6 + Math.random()*.6), max:life || .55, c:pick(cols), s:Math.random() < .3 ? 2 : 1, g: g == null ? 60 : g});
      }
      kick();
    },
    ring(xc, yc, c, grow, life){ if (reduced) return; ps.push({ring:true, x:xc/PX, y:yc/PX, c, r0:3, grow:grow || 16, life:life || .4, max:life || .4}); kick(); }
  };
})();

/* ---------- run setup ---------- */
function newRun(guided){
  const deck = []; let nid = 1;

    levels:Object.fromEntries(HAND_NAMES.map(n => [n, 1])), played:Object.fromEntries(HAND_NAMES.map(n => [n, 0])),
    boss:null, bossSuit:'S', windUsed:false, blind:null, shop:null, pack:null, cashout:null, sort:'rank', best:0, over:null, skipped:[],
    tips: guided === true || !tutDone(), tipsSeen:[]};

}
function pickBoss(){

  else run.boss = pick(Object.keys(BOSSES).filter(k => k !== 'crown' && k !== run.boss));

}
function newTrick(id){ return {id, s: JSON.parse(JSON.stringify(TRICK_STATE[id] || {}))}; }

/* ---------- hand evaluation ---------- */
function evaluate(cards){
  const n = cards.length, byRank = {};
  cards.forEach(c => (byRank[c.rank] = byRank[c.rank] || []).push(c));
  const groups = Object.values(byRank).sort((a, b) => b.length - a.length || b[0].rank - a[0].rank);
  const sizes = groups.map(g => g.length);
  let flush = false, straight = false;
  if (n === 5) {
    flush = new Set(cards.filter(c => c.enh !== 'prism').map(c => c.suit)).size <= 1;
    const rs = [...new Set(cards.map(c => c.rank))].sort((a, b) => a - b);
    if (rs.length === 5 && (rs[4] - rs[0] === 4 || rs.join() === '2,3,4,5,14')) straight = true;
  }
  let name, scoring;
  if (sizes[0] === 5 && flush) { name = 'Flush Five'; scoring = cards; }
  else if (sizes[0] === 3 && sizes[1] === 2 && flush) { name = 'Flush House'; scoring = cards; }
  else if (sizes[0] === 5) { name = 'Five of a Kind'; scoring = cards; }
  else if (straight && flush) { name = 'Straight Flush'; scoring = cards; }
  else if (sizes[0] === 4) { name = 'Four of a Kind'; scoring = groups[0]; }
  else if (sizes[0] === 3 && sizes[1] === 2) { name = 'Full House'; scoring = cards; }
  else if (flush) { name = 'Flush'; scoring = cards; }
  else if (straight) { name = 'Straight'; scoring = cards; }
  else if (sizes[0] === 3) { name = 'Three of a Kind'; scoring = groups[0]; }
  else if (sizes[0] === 2 && sizes[1] === 2) { name = 'Two Pair'; scoring = groups[0].concat(groups[1]); }
  else if (sizes[0] === 2) { name = 'Pair'; scoring = groups[0]; }
  else { name = 'High Card'; scoring = [cards.reduce((a, b) => b.rank > a.rank ? b : a)]; }
  const ids = new Set(scoring.map(c => c.id));
  return {name, scoring: cards.filter(c => ids.has(c.id))};
}

function computeHand(played){
  const b = run.blind, boss = b.boss;
  const ev = evaluate(played), lvl = run.levels[ev.name];
  let {chips, mult} = handBase(ev.name, lvl);
  if (boss === 'echochamber' && b.lastType === ev.name) { chips = Math.floor(chips/2); mult = Math.max(1, Math.floor(mult/2)); }
  if (boss === 'gatekeeper' && (ev.name === 'High Card' || ev.name === 'Pair'))
    return {ev, lvl, baseChips:0, baseMult:0, events:[], total:0, zero:true};
  const f = boss === 'crown' ? 0.75 : 1;
  const tA = v => Math.round(v*f*10)/10, tX = x => Math.round((1 + (x-1)*f)*100)/100;
  const events = [];
  ev.scoring.forEach((c, idx) => {
    let times = 1;
    if (idx === 0 && has('echo')) times++;
    if (ev.name === 'Two Pair' && has('twinengine')) times++;
    for (let t = 0; t < times; t++) {
      if (boss === 'rust' && c.suit === run.bossSuit && c.enh !== 'prism') events.push({k:'note', text:'RUSTED', card:c.id});
      else events.push({k:'c', v:cardChips(c), card:c.id});
      if (c.enh === 'etched') events.push({k:'c', v:20, card:c.id});
      if (c.enh === 'inked') events.push({k:'m', v:3, card:c.id});
      if (c.enh === 'brittle') events.push({k:'x', v:2, card:c.id});
      if (has('lowballer') && c.rank <= 5) events.push({k:'m', v:tA(4), card:c.id});
      if (has('magpie') && (c.suit === 'D' || c.enh === 'prism') && Math.random() < 1/3) events.push({k:'$', v:1, card:c.id});
    }
  });
  if (has('lantern')) b.hand.forEach(id => { const c = card(id); if (c && isRed(c)) events.push({k:'m', v:tA(2), held:id}); });
  const allScored = ev.scoring.length === played.length;
  const faces = played.some(isFace);
  run.tricks.forEach((t, ti) => {
    switch (t.id) {
      case 'nightshift': if (b.discards > 0) events.push({k:'m', v:tA(2*b.discards), ti}); break;
      case 'ledger': { const v = Math.min(10, Math.floor(run.money/3)); if (v) events.push({k:'m', v:tA(v), ti}); break; }
      case 'velvet': if (allScored) events.push({k:'c', v:tA(40), ti}); break;
      case 'straycat': events.push({k:'c', v:tA(t.s.chips), ti}); break;
      case 'odometer': t.s.n++; events.push({k:'m', v:tA(t.s.n), ti}); break;
      case 'bookend': if (played.length >= 2 && sameSuit(played[0], played[played.length-1])) events.push({k:'x', v:tX(1.5), ti}); break;
      case 'overtime': if (b.handsPlayed) events.push({k:'m', v:tA(3*b.handsPlayed), ti}); break;
      case 'understudy': if (t.s.mult) events.push({k:'m', v:tA(t.s.mult), ti}); break;
      case 'longcon': if (ev.scoring.length === 5) t.s.x = Math.round((t.s.x + 0.2)*10)/10; if (t.s.x > 1) events.push({k:'x', v:tX(t.s.x), ti}); break;
      case 'cleansweep': if (!faces) events.push({k:'x', v:tX(2.5), ti}); break;
      case 'ironvault': { const v = 1 + Math.floor(run.money/20); if (v > 1) events.push({k:'x', v:tX(v), ti}); break; }
    }
  });
  let c2 = chips, m2 = mult;
  for (const e of events) { if (e.k === 'c') c2 += e.v; else if (e.k === 'm') m2 += e.v; else if (e.k === 'x') m2 *= e.v; }
  return {ev, lvl, baseChips:chips, baseMult:mult, events, total:Math.floor(c2*m2), zero:false};
}

/* ---------- blind flow ---------- */
function startBlind(){
  const idx = run.blindIdx, boss = idx === 2 ? run.boss : null;
  let hs = 8 + (has('sparekey') ? 1 : 0);
  if (boss === 'squeeze') hs -= 2;
  run.blind = {idx, boss, target:target(idx), score:0, hands:4, discards: boss === 'drought' ? 1 : 3, handSize:hs,
    handsPlayed:0, discardsUsed:0, lastType:null, fog: boss === 'fog', draw: shuffle(run.deck.map(c => c.id)), hand:[]};
  run.phase = 'play'; sel.clear(); shown = new Set(); dealNext = []; lastFog = false; drawUp(true); save(); go();
}
function skipBlind(){

  const od = trickOf('odometer'); if (od) od.s.n = 0;
  toast(od ? 'Skipped. Odometer reset to 0' : 'Blind skipped');
  SFX.page(); save(); go();
}
function drawUp(sortAll){
  const b = run.blind;
  const fresh = [];
  while (b.hand.length < b.handSize && b.draw.length) { const id = b.draw.pop(); b.hand.push(id); fresh.push(id); }
  if (sortAll) sortHand();
  return fresh;
}
function sortHand(){
  const b = run.blind; if (!b) return;
  b.hand.sort((x, y) => {
    const a = card(x), c = card(y);
    return run.sort === 'rank' ? (c.rank - a.rank) || (SORD[a.suit] - SORD[c.suit]) : (SORD[a.suit] - SORD[c.suit]) || (c.rank - a.rank);

}
function removeCards(ids){
  const s = new Set(ids);
  run.deck = run.deck.filter(c => !s.has(c.id));
  if (run.blind) { run.blind.hand = run.blind.hand.filter(id => !s.has(id)); run.blind.draw = run.blind.draw.filter(id => !s.has(id)); }
}
const handEl = id => document.querySelector(`#handzone [data-id="${id}"]`);

function prepareWin(){
  const b = run.blind, lines = [];
  lines.push([`${blindName(b.idx)} cleared`, REWARD[b.idx]]);
  if (b.hands > 0) lines.push([`${b.hands} unused hand${b.hands > 1 ? 's' : ''}`, b.hands]);
  const interest = Math.min(5, Math.floor(run.money/5));
  if (interest) lines.push([`Interest on $${run.money}`, interest]);
  if (has('tipjar') && b.discardsUsed === 0) lines.push(['Tip Jar', 2]);
  const gilded = b.hand.map(card).filter(c => c && c.enh === 'gilded').length;
  if (gilded) lines.push([`Gilded held ×${gilded}`, 2*gilded]);
  const pawn = trickOf('pawn'); if (pawn) pawn.s.bonus += 2;
  run.cashout = {lines, total: lines.reduce((s, l) => s + l[1], 0), score:b.score, target:b.target, boss: b.idx === 2};
  run.phase = 'cashout';
}
function stats(b){
  const fav = HAND_NAMES.reduce((a, n) => run.played[n] > run.played[a] ? n : a, 'High Card');
  return {ante:run.ante, blind:b ? blindName(b.idx) : '', score:b ? b.score : 0, target:b ? b.target : 0, best:run.best, fav, favN:run.played[fav]};
}

async function play(){
  const b = run.blind; if (busy || !b || run.phase !== 'play') return;
  const ids = b.hand.filter(id => sel.has(id));
  const max = b.boss === 'ration' ? 4 : 5;
  if (!ids.length || ids.length > max) return;
  busy = true; closeSheet();
  if (run.tips) { seeTip('goal'); seeTip('readout'); }
  const rects = {};
  ids.forEach(id => { const el = handEl(id); if (el) rects[id] = el.getBoundingClientRect(); });
  const moneyBefore = run.money, scoreBefore = b.score;
  b.hand = b.hand.filter(id => !sel.has(id)); sel.clear();
  const handShown = b.hand.slice();
  if (b.boss === 'tax') run.money = Math.max(0, run.money - 1);
  b.fog = false;
  const played = ids.map(card);
  const res = computeHand(played);
  // Apply the whole result now, so leaving mid-animation never loses the hand.
  run.money += res.events.filter(e => e.k === '$').reduce((s, e) => s + e.v, 0);
  b.score += res.total; run.best = Math.max(run.best, res.total);
  run.played[res.ev.name]++; b.lastType = res.ev.name; b.hands--; b.handsPlayed++;
  const shattered = res.ev.scoring.filter(c => c.enh === 'brittle' && Math.random() < 0.2);
  if (shattered.length) removeCards(shattered.map(c => c.id));
  let outcome = 'next';
  if (b.score >= b.target) { outcome = 'win'; prepareWin(); }
  else if (b.hands <= 0) {
    if (has('secondwind') && !run.windUsed) { run.windUsed = true; b.hands = 1; outcome = 'wind'; }
    else outcome = 'lose';
  }
  let fresh = [];
  if (outcome === 'next' || outcome === 'wind') { fresh = drawUp(false); if (!b.hand.length) outcome = 'lose'; }
  if (outcome === 'lose') { run.over = stats(b); run.phase = 'over'; }
  save();

  renderPlay({played, scoring: new Set(res.ev.scoring.map(c => c.id)), hand: handShown, money: moneyBefore, score: scoreBefore});
  if (!reduced) {
    const anims = [];
    played.forEach((c, i) => {
      const el = document.querySelector(`#table [data-id="${c.id}"]`), r0 = rects[c.id];
      if (!el || !r0) return;
      const r1 = el.getBoundingClientRect();
      const dx = (r0.left + r0.width/2) - (r1.left + r1.width/2), dy = (r0.top + r0.height/2) - (r1.top + r1.height/2);
      anims.push(el.animate([{transform:`translate(${dx}px,${dy}px)`}, {transform:'none'}], {duration:200, delay:i*40, easing:'steps(4, end)', fill:'backwards'}).finished.catch(() => {}));
    });
    SFX.whoosh();
    await Promise.all(anims);
  }
  await animateScore(res, scoreBefore, moneyBefore);
  if (shattered.length) {
    shattered.forEach(c => { const el = document.querySelector(`#table [data-id="${c.id}"]`); if (el) { const p = center(el); FX.burst(p.x, p.y, [BO, '#7c7790'], 22, 60, .7, 120); el.style.visibility = 'hidden'; } });
    SFX.shatter();
    toast(shattered.map(c => RANK_LABEL(c.rank) + ' of ' + SUIT_NAME[c.suit] + 's').join(', ') + ' shattered');
  }
  await sleep(D(360));
  if (!reduced) {
    const out = [...document.querySelectorAll('#table .card')].map((el, i) => el.animate([{opacity:1}, {opacity:0, transform:'translateY(-30px)'}], {duration:200, delay:i*30, easing:'steps(3, end)', fill:'forwards'}).finished.catch(() => {}));
    await Promise.all(out);
  }
  if (outcome === 'wind') toast('Second Wind: 1 more hand');
  if (outcome === 'win') { chord(); setTimeout(SFX.shimmer, 300); haptic(30); await showBanner(`ANTE ${ROM[run.ante]}`, b.idx === 2 ? `${BOSSES[run.boss].name} falls` : 'Blind cleared'); }
  else if (outcome === 'lose') { gloom(); haptic([40, 60, 40]); await showBanner(`ANTE ${ROM[run.ante]}`, 'Out of hands', true); }
  busy = false;
  dealNext = outcome === 'next' || outcome === 'wind' ? fresh : [];
  go();
}
async function discard(){
  const b = run.blind; if (busy || !b || run.phase !== 'play') return;
  const ids = b.hand.filter(id => sel.has(id));
  if (!ids.length || ids.length > 5 || b.discards <= 0) return;
  busy = true; closeSheet();
  b.hand = b.hand.filter(id => !sel.has(id)); sel.clear();
  b.discards--; b.discardsUsed++; b.fog = false;
  const sc = trickOf('straycat');
  const bumped = sc && !ids.map(card).some(isFace);
  if (bumped) sc.s.chips += 5;

/* ---------- shop ---------- */
function rollTrickId(ex){

  const r = Math.random(), rar = r < 0.7 ? 'Common' : r < 0.95 ? 'Uncommon' : 'Rare';
  let pool = Object.keys(TRICKS).filter(k => TRICKS[k].r === rar && !owned.has(k));

}

  const r = Math.random();

  if (r < 0.8) return {kind:'charm', id:pick(Object.keys(CHARMS)), cost:3};

}

}

function buyItem(i, el){

    if (has(it.id)) return toast(`You already have ${TRICKS[it.id].name}`);
    if (run.tricks.length >= 5) return toast('Your Trick rail is full. Sell one first');
    run.tricks.push(newTrick(it.id));

}

function buyPack(i, el){

/* ---------- drag to reorder: hand cards and Tricks ---------- */
function startDrag(e){
  if (busy || e.button > 0) return;
  const cardEl = e.target.closest && e.target.closest('#handzone .card');
  const trickEl = !cardEl && e.target.closest && e.target.closest('#rail .trick[data-ti]');
  if (!cardEl && !trickEl) return;
  if (cardEl && (!run || run.phase !== 'play' || !run.blind)) return;
  const zone = cardEl ? $('#handzone') : $('#rail');
  drag = {kind: cardEl ? 'card' : 'trick', el: cardEl || trickEl, zone, pid: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false,
    id: cardEl ? Number(cardEl.dataset.id) : Number(trickEl.dataset.ti)};
}
function moveDrag(e){
  const d = drag; if (!d || e.pointerId !== d.pid) return;
  const dx = e.clientX - d.x0;
  if (!d.moved) {
    if (Math.abs(dx) < 7 || Math.abs(dx) < Math.abs(e.clientY - d.y0)) { if (Math.abs(e.clientY - d.y0) > 12) drag = null; return; }
    d.moved = true;
    try { d.zone.setPointerCapture(d.pid); } catch (err) {}
    d.el.classList.add('drag');
    if (d.kind === 'card') { d.list = run.blind.hand; d.idx = d.list.indexOf(d.id); d.geo = d.zone._geo; }
    else { d.list = run.tricks; d.idx = d.id; const r = d.zone.getBoundingClientRect(); const tw = (r.width - 32)/5; d.geo = {step: tw + 8, off: 0, cw: tw, W: r.width, n: run.tricks.length}; }
    d.base = d.geo.off + d.idx*d.geo.step;
    d.grabX = e.clientX;
    SFX.grab();
  }
  e.preventDefault();
  const g = d.geo;
  const want = d.base + (e.clientX - d.grabX);
  const to = Math.max(0, Math.min(g.n - 1, Math.round((want - g.off)/g.step)));
  if (to !== d.idx) {
    const item = d.list.splice(d.idx, 1)[0]; d.list.splice(to, 0, item); d.idx = to;
    if (d.kind === 'card') {
      d.list.forEach((id, i) => { const el = handEl(id); if (el && el !== d.el) { el.style.left = Math.round(g.off + i*g.step) + 'px'; el.style.zIndex = i + 1; } });
    } else reflowTricks(d);
    SFX.slot();
  }
  const off = Math.max(-(g.off + to*g.step), Math.min(g.W - g.cw - g.off - to*g.step, want - (g.off + to*g.step)));
  if (d.kind === 'card') { d.el.style.left = Math.round(g.off + to*g.step) + 'px'; d.el.style.transform = `translate(${Math.round(off)}px,-22px)`; }
  else d.el.style.transform = `translate(${Math.round(want - d.base)}px,-8px)`;
}
function reflowTricks(d){
  // Shift the other tiles visually to their new slots without re-rendering.
  d.zone.querySelectorAll('.trick[data-ti]').forEach(el => {
    if (el === d.el) return;
    const orig = Number(el.dataset.ti), now = d.list.indexOf(d.origList[orig]);
    el.style.transform = now === orig ? '' : `translateX(${Math.round((now - orig)*d.geo.step)}px)`;

function endDrag(e){

  }

}
